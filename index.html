    let language = 'pl';
    let formState = '';
    const form = document.getElementById('contact-form');
    const fields = ['name','email','message'].map(id => document.getElementById(id));
    const nav = document.getElementById('navigation');
    const toggle = document.querySelector('.menu-toggle');
    const status = document.getElementById('form-status');
    const themeToggle = document.querySelector('.theme-toggle');
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');
    let savedTheme = null;
    try { savedTheme = localStorage.getItem('wolski-theme'); } catch {}
    if (savedTheme !== 'light' && savedTheme !== 'dark') savedTheme = null;
    let theme = savedTheme || (systemTheme.matches ? 'dark' : 'light');
    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      const label = translations[language][theme === 'dark' ? 'themeLight' : 'themeDark'];
      themeToggle.setAttribute('aria-label',label);
      themeToggle.title = label;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#191c24' : '#60688a';
    }
    themeToggle.addEventListener('click',() => {
      theme = theme === 'dark' ? 'light' : 'dark';
      savedTheme = theme;
      try { localStorage.setItem('wolski-theme',theme); } catch {}
      applyTheme();
    });
    systemTheme.addEventListener('change',event => {
      if (!savedTheme) { theme = event.matches ? 'dark' : 'light'; applyTheme(); }
    });

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }
    function renderCards(id, items, className) {
      document.getElementById(id).replaceChildren(...items.map(([title,copy],index) => {
        const card = element('article', className);
        if (className === 'service') {
          const icon = document.createElementNS('http://www.w3.org/2000/svg','svg');
          icon.setAttribute('class','service-icon');
          icon.setAttribute('viewBox','0 0 48 48');
          icon.setAttribute('aria-hidden','true');
          const use = document.createElementNS('http://www.w3.org/2000/svg','use');
          use.setAttribute('href','#law-icon-'+index);
          icon.append(use); card.append(icon);
        }
        card.append(element('h3','',title),element('p','',copy));
        return card;
      }));
    }
    function setMenu(open) {
      nav.classList.toggle('open',open);
      toggle.setAttribute('aria-expanded',String(open));
      toggle.setAttribute('aria-label',translations[language][open ? 'menuClose' : 'menuOpen']);
    }
    function validateField(field) {
      const valid = Boolean(field.value.trim()) && field.validity.valid;
      field.setAttribute('aria-invalid',String(!valid));
      document.getElementById(field.id+'-error').textContent = valid ? '' : translations[language].errors[field.id];
      return valid;
    }
    function setLanguage(next) {
      language = next;
      applyTheme();
      const t = translations[language];
      document.documentElement.lang = language;
      document.title = t.title;
      document.querySelector('meta[name="description"]').content = t.description;
      document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = t[node.dataset.i18n]; });
      document.querySelectorAll('[data-aria]').forEach(node => { node.setAttribute('aria-label',t[node.dataset.aria]); });
      document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.lang === language)));
      document.getElementById('phone-link').href = t.phoneHref;
      document.getElementById('email-link').href = t.emailHref;
      renderCards('services-list',t.services,'service');
      renderCards('principles-list',t.principles,'principle');
      document.getElementById('team-list').replaceChildren(...t.team.map(person => {
        const card = element('article','person');
        const portrait = element('div','portrait');
        portrait.setAttribute('role','img');
        portrait.setAttribute('aria-label',t.portraitLabel+' '+person.name);
        const initials = element('span','initials',person.initials);
        initials.setAttribute('aria-hidden','true');
        portrait.append(initials);
        card.append(portrait,element('h3','',person.name),element('p','person-role',person.role),element('p','',person.specialty));
        return card;
      }));
      fields.filter(field => field.getAttribute('aria-invalid') === 'true').forEach(validateField);
      status.textContent = formState ? t[formState] : '';
      setMenu(false);
    }
    document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click',() => setLanguage(button.dataset.lang)));
    toggle.addEventListener('click',() => setMenu(toggle.getAttribute('aria-expanded') !== 'true'));
    document.addEventListener('keydown',event => {
      if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') { setMenu(false); toggle.focus(); }
    });
    document.addEventListener('click',event => { if (!event.target.closest('.header')) setMenu(false); });
    matchMedia('(min-width:1000px)').addEventListener('change',() => setMenu(false));
    document.querySelectorAll('a[href^="#"]').forEach(link => link.addEventListener('click',() => {
      setMenu(false);
      const target = document.querySelector(link.getAttribute('href'));
      target.setAttribute('tabindex','-1');
      target.focus({preventScroll:true});
    }));
    fields.forEach(field => field.addEventListener('input',() => {
      if (field.hasAttribute('aria-invalid')) validateField(field);
      formState = ''; status.textContent = '';
    }));
    form.addEventListener('submit',event => {
      event.preventDefault();
      const results = fields.map(validateField);
      formState = results.every(Boolean) ? 'success' : 'invalid';
      status.textContent = translations[language][formState];
      if (formState === 'invalid') fields[results.indexOf(false)].focus();
      else { form.reset(); fields.forEach(field => field.removeAttribute('aria-invalid')); }
    });
    setLanguage('pl');
  </script>
